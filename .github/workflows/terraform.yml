
name: Build 10MCord Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Extrair projeto
        run: |
          unzip -q 10MCord-source-V1.0.zip -d .

          echo "=== PASTAS DO PROJETO ==="
          find . -maxdepth 5 -type d

          echo "=== ARQUIVOS GRADLE ==="
          find . -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Encontrar Installer
        run: |
          WRAPPER=$(find . -type f -name gradlew | grep '/android/installer/gradlew$' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "Gradle do Installer não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Compilar Installer
        run: ./gradlew :app:assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: 10MCord-Installer
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
