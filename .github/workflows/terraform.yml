name: Build 10MCord Installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/terraform.yml'
      - '10MCord-SourceW.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installer APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Extrair projeto
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/10MCord-SourceW.zip"
          unzip -q "$GITHUB_WORKSPACE/10MCord-SourceW.zip" -d "$GITHUB_WORKSPACE"

      - name: Encontrar Installer
        run: |
          set -euo pipefail
          WRAPPER="$(find "$GITHUB_WORKSPACE" -type f -path '*/android/installer/gradlew' -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "Gradle do Installer não encontrado no SourceW."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Compilar Installer
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Preparar APK para download
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "O build terminou sem gerar um APK debug."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/10MCord-Installer-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/10MCord-Installer-debug.apk"

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: 10MCord-Installer
          path: artifacts/10MCord-Installer-debug.apk
          if-no-files-found: error
